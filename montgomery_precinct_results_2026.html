<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>County Precinct Results 2026</title>
<style>
  :root {
    color-scheme: light;
    --surface-1: #fcfcfb;
    --page: #f9f9f7;
    --text-primary: #0b0b0b;
    --text-secondary: #52514e;
    --muted: #898781;
    --grid: #e1e0d9;
    --axis: #c3c2b7;
    --border: rgba(11,11,11,0.10);
    --tooltip-bg: #ffffff;
    --row-hover: rgba(11,11,11,0.045);
    --stroke-map: #fcfcfb;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --surface-1: #1a1a19; --page: #0d0d0d;
      --text-primary: #ffffff; --text-secondary: #c3c2b7; --muted: #898781;
      --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10);
      --tooltip-bg: #232322; --row-hover: rgba(255,255,255,0.06); --stroke-map: #1a1a19;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface-1: #1a1a19; --page: #0d0d0d;
    --text-primary: #ffffff; --text-secondary: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10);
    --tooltip-bg: #232322; --row-hover: rgba(255,255,255,0.06); --stroke-map: #1a1a19;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--page); color: var(--text-primary);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 28px 16px 56px; }
  h1 { font-size: 24px; line-height: 1.25; margin: 0 0 6px; font-weight: 650; letter-spacing: -0.01em; }
  .sub { color: var(--text-secondary); font-size: 14px; margin: 0 0 20px; max-width: 76ch; }

  .controls { display: flex; flex-wrap: wrap; gap: 10px 12px; align-items: flex-end; margin-bottom: 16px; }
  .field { min-width: 0; }
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field label { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  select {
    appearance: none; font: inherit; font-size: 14px; color: var(--text-primary);
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 9px;
    padding: 9px 32px 9px 12px; cursor: pointer; max-width: 330px;
    background-image: linear-gradient(45deg, transparent 50%, currentColor 50%),
                      linear-gradient(135deg, currentColor 50%, transparent 50%);
    background-position: calc(100% - 17px) 55%, calc(100% - 12px) 55%;
    background-size: 5px 5px, 5px 5px; background-repeat: no-repeat;
  }
  select:focus-visible { outline: 2px solid #3987e5; outline-offset: 1px; }
  #race { max-width: 420px; width: 420px; }
  @media (max-width: 760px) { #race { width: 100%; } }
  .spacer { flex: 1 1 auto; }
  .ghost {
    appearance: none; cursor: pointer; font: inherit; font-size: 13px;
    color: var(--text-secondary); background: var(--surface-1);
    border: 1px solid var(--border); border-radius: 8px; padding: 9px 12px;
  }
  .ghost:hover { color: var(--text-primary); }
  .ghost[aria-pressed="true"] { background: var(--text-primary); color: var(--surface-1); border-color: transparent; }

  .panel { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; }

  /* result header: the race, its candidates, countywide bar */
  .rhead { padding: 16px 20px 14px; margin-bottom: 16px; }
  .rhead h2 { font-size: 18px; margin: 0 0 2px; font-weight: 650; letter-spacing: -0.01em; }
  .rhead .meta { font-size: 12.5px; color: var(--muted); margin-bottom: 13px; }
  .bar { display: flex; height: 10px; border-radius: 5px; overflow: hidden; gap: 2px; margin-bottom: 11px; }
  .bar span { display: block; }
  .clist { display: flex; flex-wrap: wrap; gap: 8px 26px; }
  .cand { display: flex; align-items: baseline; gap: 8px; font-size: 14px; }
  .cand .sw { width: 11px; height: 11px; border-radius: 3px; flex: 0 0 auto; align-self: center; border: 1px solid var(--border); }
  .cand .nm { font-weight: 600; }
  .cand .pa { color: var(--muted); font-size: 12.5px; }
  .cand .vt { color: var(--text-secondary); font-variant-numeric: tabular-nums; }
  .cand.win .nm::after { content: " \2713"; color: #006300; font-weight: 700; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .cand.win .nm::after { color: #0ca30c; } }
  :root[data-theme="dark"] .cand.win .nm::after { color: #0ca30c; }

  .cols { display: grid; grid-template-columns: minmax(340px, 1.15fr) minmax(330px, 1fr); gap: 16px; align-items: start; }
  @media (max-width: 900px) { .cols { grid-template-columns: 1fr; } }

  .mapcard { padding: 14px 14px 10px; }
  svg.map { display: block; width: 100%; height: auto; }
  .prec { stroke: var(--stroke-map); stroke-width: 1; cursor: pointer; vector-effect: non-scaling-stroke; }
  .prec:focus { outline: none; }
  .prec.hot { stroke: var(--text-primary); stroke-width: 2.4; }
  .lbl.hidden { display: none; }
  .prec.off { cursor: default; }
  .lbl { font-size: calc(8.5px * var(--zoom, 1)); fill: var(--text-primary); pointer-events: none; text-anchor: middle;
         paint-order: stroke; stroke: var(--surface-1);
         stroke-width: calc(2.4px * var(--zoom, 1)); stroke-linejoin: round; }
  .lbl.off { fill: var(--muted); }

  .legend { padding: 6px 6px 2px; }
  .legend .ramp { height: 12px; border-radius: 3px; border: 1px solid var(--border); }
  .legend .ticks { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--muted); margin-top: 5px; font-variant-numeric: tabular-nums; }
  .legend .ends { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-secondary); margin-top: 2px; gap: 12px; }
  .legend .note { font-size: 12px; color: var(--muted); margin-top: 7px; }

  .tablecard { overflow: hidden; }
  .tablehead { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; padding: 13px 16px 9px; }
  .tablehead h2 { font-size: 14px; margin: 0; font-weight: 650; }
  .tablehead span { font-size: 12.5px; color: var(--muted); }
  .scroll { max-height: 640px; overflow-y: auto; overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  thead th {
    position: sticky; top: 0; background: var(--surface-1); z-index: 1;
    text-align: right; font-weight: 600; font-size: 11px; letter-spacing: .05em;
    text-transform: uppercase; color: var(--muted);
    padding: 6px 10px 7px; border-bottom: 1px solid var(--axis);
  }
  thead th:first-child, thead th:nth-child(2) { text-align: left; }
  tbody td { padding: 6px 10px; border-bottom: 1px solid var(--grid); font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
  tbody td:first-child { color: var(--muted); text-align: left; width: 34px; }
  tbody td:nth-child(2) { text-align: left; color: var(--text-primary); width: 1%; }
  tbody tr { cursor: pointer; }
  tbody tr:hover, tbody tr.hot { background: var(--row-hover); }
  tbody tr.off td { color: var(--muted); }
  .chip { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 7px; vertical-align: -1px; border: 1px solid var(--border); }
  .val { font-weight: 600; }

  #tip {
    position: fixed; z-index: 50; pointer-events: none; opacity: 0;
    transition: opacity .09s linear; max-width: 340px;
    background: var(--tooltip-bg); color: var(--text-primary);
    border: 1px solid var(--border); border-radius: 10px;
    box-shadow: 0 6px 24px rgba(0,0,0,.14); padding: 11px 13px;
    font-size: 13px; line-height: 1.45;
  }
  #tip.on { opacity: 1; }
  #tip .tname { font-weight: 650; font-size: 14.5px; }
  #tip .trace { font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 9px; }
  #tip table { font-size: 12.5px; width: 100%; }
  #tip td { padding: 2px 0; border: 0; white-space: normal; }
  #tip td.c { text-align: left; padding-right: 12px; }
  #tip td.v { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  #tip .rule { border-top: 1px solid var(--grid); margin: 9px 0 7px; }
  #tip .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
  #tip .lead { font-weight: 650; }
  #tip .yr { font-size: 11px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
  #tip .ctx { font-size: 11.5px; color: var(--muted); margin-top: 8px; line-height: 1.5; }

  .foot { color: var(--muted); font-size: 12.5px; margin-top: 18px; line-height: 1.6; }
  @media (forced-colors: active) { .prec { stroke: CanvasText; forced-color-adjust: none; } }
</style>
</head>

<div class="wrap">
  <h1 id="h1"></h1>
  <p class="sub" id="sub"></p>

  <div class="controls">
    <div class="field">
      <label for="race">Race</label>
      <select id="race"></select>
    </div>
    <div class="field">
      <label for="metric">Shade by</label>
      <select id="metric"></select>

    <div class="spacer"></div>
    <button class="ghost" id="labels" type="button" aria-pressed="true">Precinct labels</button>
    <button class="ghost" id="theme" type="button">Toggle theme</button>
  </div>

  <div class="panel rhead" id="rhead"></div>

  <div class="cols">
    <div class="panel mapcard">
      <svg class="map" id="map" role="img" aria-labelledby="maptitle"><title id="maptitle"></title></svg>
      <div class="legend">
        <div class="ramp" id="legramp"></div>
        <div class="ticks" id="legticks"></div>
        <div class="ends" id="legends"></div>
        <div class="note" id="legnote"></div>
      </div>
    </div>

    <div class="panel tablecard">
      <div class="tablehead">
        <h2 id="tabletitle"></h2>
        <span id="tablenote"></span>
      </div>
      <div class="scroll">
        <table><thead><tr id="thead"></tr></thead><tbody id="rows"></tbody></table>
      </div>
    </div>
  </div>

  <p class="foot" id="foot"></p>
</div>

  const x = Math.max(0, Math.min(1, t)) * (ok.length - 1);
  const i = Math.min(ok.length - 2, Math.floor(x)), f = x - i;
  const A = ok[i], B = ok[i+1];
  return fromOklab(A[0]+(B[0]-A[0])*f, A[1]+(B[1]-A[1])*f, A[2]+(B[2]-A[2])*f);
}
/** Diverging: t in [-1,1], blue positive, red negative, gray at zero. */
function diverging(t){
  const r = ramp();
  return lerpStops([r.mid].concat(t >= 0 ? r.blue : r.red), Math.abs(t));
}
/** Sequential in one hue: t in [0,1]. */
function sequential(hue, t){ const r = ramp(); return lerpStops([r.mid].concat(r[hue]), t); }
const HUE_OF = { D: 'blue', R: 'red', O: 'violet' };
const swatch = b => ramp()[HUE_OF[b]][3];

/* ---------- state ---------- */
const $ = id => document.getElementById(id);
const nf = n => n.toLocaleString('en-US');
const pct = (n, d=1) => n === null ? '—' : n.toFixed(d) + '%';
const signed = (n, d=1) => (n >= 0 ? '+' : '−') + Math.abs(n).toFixed(d);

let RACE = DATA.races[0];
let VIEW = 'county';

/* The city precincts are the tightly packed small ones; find them by area
   rather than by name so the view survives a boundary redraw. */
const AREAS = DATA.shapes.map(s => s.area).sort((a,b) => a-b);
const MEDIAN_AREA = AREAS[Math.floor(AREAS.length/2)];
const CITY = DATA.cityLabel ? DATA.shapes.filter(s => s.area < MEDIAN_AREA * 0.15) : [];
const CITY_BOX = (() => {
  if(!CITY.length) return null;
  const b = CITY.reduce((a,s) => [Math.min(a[0],s.bbox[0]), Math.min(a[1],s.bbox[1]),
                                  Math.max(a[2],s.bbox[2]), Math.max(a[3],s.bbox[3])],
                        [1e9,1e9,-1e9,-1e9]);
  const w = b[2]-b[0], h = b[3]-b[1], pad = Math.max(w,h) * 0.18;
  return [b[0]-pad, b[1]-pad, w+2*pad, h+2*pad];
})();
let METRIC = null;      // {kind:'margin'|'cand'|'turnout', idx?}
let PINNED = null;

const poss = n => n + (/s$/i.test(n) ? "'" : "'s");

/** Last real name word: drops "(W/I)" and Jr/Sr/II style suffixes. */
function surname(name){
  const w = name.replace(/\(.*?\)/g, '').replace(/,/g, ' ').trim().split(/\s+/);
  while(w.length > 1 && /^(jr|sr|i{1,3}|iv|v)\.?$/i.test(w[w.length-1])) w.pop();
  return w[w.length-1] || name;
}

const partyShort = p =>
  p === 'Democratic' ? 'D' : p === 'Republican' ? 'R' :
  p === 'Libertarian' ? 'L' : p === 'Independent' ? 'I' :
  p === 'Non Partisan' ? 'NP' : p;

/* ---------- map ---------- */
const svg = $('map');
svg.setAttribute('viewBox', DATA.viewBox);
const NS = 'http://www.w3.org/2000/svg';
const gShapes = document.createElementNS(NS,'g');
const gLabels = document.createElementNS(NS,'g');
svg.append(gShapes, gLabels);
const paths = {}, labels = {}, SHAPE = {};

for(const s of DATA.shapes){
  SHAPE[s.name] = s;
  const p = document.createElementNS(NS,'path');
  p.setAttribute('d', s.d);
  p.setAttribute('class','prec');
  p.setAttribute('fill-rule','evenodd');
  p.setAttribute('tabindex','0');
  p.setAttribute('role','img');
  p.addEventListener('pointerenter', e => hover(s.name, e));
  p.addEventListener('pointermove', moveTip);
  p.addEventListener('pointerleave', unhover);
  p.addEventListener('focus', () => { const b = p.getBoundingClientRect();
    hover(s.name, {clientX: b.left + b.width/2, clientY: b.top}); });
  p.addEventListener('blur', unhover);
  p.addEventListener('click', () => { PINNED = PINNED === s.name ? null : s.name; paint(); });
  gShapes.appendChild(p);
  paths[s.name] = p;

  const t = document.createElementNS(NS,'text');
  t.setAttribute('class','lbl');
  t.setAttribute('x', s.cx); t.setAttribute('y', s.cy + 3);
  t.textContent = s.name;
  gLabels.appendChild(t);
  labels[s.name] = t;
}

/* ---------- metric plumbing ---------- */
function metricsFor(r){
  const out = [];
  if(r.prior)
    out.push({kind:'shift', label:`Shift from ${r.prior.year} — Democratic two-party share`});
  if(r.margin){
    const d = r.cands[r.demIdx], p = r.cands[r.repIdx];
    out.push({kind:'margin', label:`Margin: ${d.name} (D) − ${p.name} (R)`});
  }
  r.cands.forEach((c, i) => out.push({kind:'cand', idx:i, label:`${c.name} — share of vote`}));
  out.push({kind:'turnout', label:'Ballots cast in this race'});
  return out;
}
/** The value the map and table rank on, or null where the race is not on the ballot. */
function dTwo(d, rr){ return (d + rr) ? 100 * d / (d + rr) : null; }

function valueAt(r, prec){
  const row = r.precincts[prec];
  if(!row) return null;
  if(METRIC.kind === 'shift'){
    const p = r.prior.precincts[prec];
    if(!p || row.total === 0) return null;
    const a = dTwo(p.d, p.r), b = dTwo(row.v[r.demIdx], row.v[r.repIdx]);
    return (a === null || b === null) ? null : b - a;
  }
  if(METRIC.kind === 'turnout') return row.total;
  if(row.total === 0) return null;
  if(METRIC.kind === 'margin')
    return 100 * (row.v[r.demIdx] - row.v[r.repIdx]) / row.total;
  return 100 * row.v[METRIC.idx] / row.total;
}
function fmtValue(v){
  if(v === null) return '—';
  if(METRIC.kind === 'turnout') return nf(v);
  if(METRIC.kind === 'margin' || METRIC.kind === 'shift') return signed(v) + ' pp';
  return pct(v);
}

/* ---------- tooltip ---------- */
const tip = $('tip');
function tipHTML(name){
  const r = RACE, s = SHAPE[name], row = r.precincts[name];
  if(!row || row.total === 0) return `<div class="tname">${name}</div>
    <div class="trace">${r.office}</div>
    <div style="color:var(--muted)">${row
      ? 'On the ballot here, but no ballots were cast in this race.'
      : 'Not on the ballot in this precinct.'}</div>
    ${ctxHTML(s)}`;
  const lead = row.total ? row.v.indexOf(Math.max(...row.v)) : -1;
  const tie = row.total && row.v.filter(x => x === row.v[lead]).length > 1;
  const rows = r.cands.map((c,i) => `
    <tr${i === lead && !tie ? ' class="lead"' : ''}>
      <td class="c"><span class="dot" style="background:${swatch(c.bucket)}"></span>${c.name} (${partyShort(c.party)})</td>
      <td class="v">${nf(row.v[i])} &middot; ${row.total ? pct(100*row.v[i]/row.total) : '—'}</td></tr>`).join('');
  const marg = r.margin && row.total
    ? `<tr><td class="c">Margin</td><td class="v" style="color:${
        row.v[r.demIdx] >= row.v[r.repIdx] ? ramp().blue[4] : ramp().red[4]}">${
        signed(100*(row.v[r.demIdx]-row.v[r.repIdx])/row.total)} pp</td></tr>` : '';
  // With a 2022 baseline, lead with the two years side by side.
  let prior = '';
  if(r.prior && r.prior.precincts[name]){
    const p = r.prior.precincts[name];
    const a = dTwo(p.d, p.r), b = row.total ? dTwo(row.v[r.demIdx], row.v[r.repIdx]) : null;
    const sh = (a === null || b === null) ? null : b - a;
    prior = `<div class="rule"></div>
      <table>
        <tr><td class="c yr" colspan="2">${r.prior.year}</td></tr>
        <tr><td class="c"><span class="dot" style="background:${ramp().blue[3]}"></span>${r.prior.dem} (D)</td>
            <td class="v">${nf(p.d)} &middot; ${p.total ? pct(100*p.d/p.total) : '—'}</td></tr>
        <tr><td class="c"><span class="dot" style="background:${ramp().red[3]}"></span>${r.prior.rep} (R)</td>
            <td class="v">${nf(p.r)} &middot; ${p.total ? pct(100*p.r/p.total) : '—'}</td></tr>
        ${p.o > 0 ? `<tr><td class="c" style="color:var(--text-secondary)">Other / write-in</td>
            <td class="v" style="color:var(--text-secondary)">${nf(p.o)} &middot; ${pct(100*p.o/p.total)}</td></tr>` : ''}
        <tr><td class="c" style="color:var(--text-secondary)">Ballots cast</td>
            <td class="v" style="color:var(--text-secondary)">${nf(p.total)}</td></tr>
      </table>
      <div class="rule"></div>
      <table>
        <tr><td class="c">D two-party share</td><td class="v">${pct(a)} &rarr; ${pct(b)}</td></tr>
        <tr><td class="c lead">Shift since ${r.prior.year}</td>
            <td class="v lead" style="color:${sh === null ? 'inherit' : (sh >= 0 ? ramp().blue[4] : ramp().red[4])}">${
              sh === null ? '—' : signed(sh) + ' pp'}</td></tr>
      </table>`;
  }
  return `<div class="tname">${name}</div>
    <div class="trace">${r.office}</div>
    ${r.prior ? '<div class="yr" style="margin:-4px 0 4px">2026</div>' : ''}
    <table>${rows}</table>
    <div class="rule"></div>
    <table>
      <tr><td class="c">Ballots cast in this race</td><td class="v">${nf(row.total)}</td></tr>
      ${marg}
    </table>${prior}${ctxHTML(s)}`;
}
function ctxHTML(s){
  const bits = [];
  if(s.comm) bits.push('Commissioner ' + s.comm.replace('District ','Dist. '));
  if(s.council) bits.push('Council ' + s.council.replace('District ','Dist. '));
  if(s.cong) bits.push('US House ' + s.cong);
  if(s.senate) bits.push('State Sen. ' + s.senate);
  if(s.house) bits.push('State House ' + s.house);
  return bits.length ? `<div class="ctx">${bits.join(' · ')}</div>` : '';
}
function hover(name, e){ tip.innerHTML = tipHTML(name); tip.classList.add('on'); moveTip(e); highlight(name); }
function moveTip(e){
  const w = tip.offsetWidth, h = tip.offsetHeight;
  let x = e.clientX + 16, y = e.clientY + 16;
  if(x + w > innerWidth - 8) x = e.clientX - w - 16;
  if(y + h > innerHeight - 8) y = Math.max(8, e.clientY - h - 16);
  tip.style.left = x + 'px'; tip.style.top = y + 'px';
}
function unhover(){ tip.classList.remove('on'); highlight(PINNED); }
function highlight(name){
  for(const k in paths) paths[k].classList.toggle('hot', k === name);
  for(const tr of $('rows').children) tr.classList.toggle('hot', tr.dataset.name === name);
}

/* ---------- render ---------- */
function paint(){
  const r = RACE;
  const onBallot = DATA.precincts.filter(p => r.precincts[p]);
  const vals = onBallot.map(p => valueAt(r, p)).filter(v => v !== null);
  const maxAbs = vals.length ? Math.max(...vals.map(Math.abs)) : 1;

  let domain, fill, lo = 0, hi = 1;
  if(METRIC.kind === 'margin' || METRIC.kind === 'shift'){
    domain = Math.max(5, Math.ceil(maxAbs / 5) * 5);
    lo = -domain; hi = domain;
    fill = v => diverging(v / domain);
  } else {
    const hue = METRIC.kind === 'turnout' ? 'orange' : HUE_OF[r.cands[METRIC.idx].bucket];
    lo = vals.length ? Math.min(...vals) : 0;
    hi = vals.length ? Math.max(...vals) : 1;
    if(hi - lo < 1e-9){ lo = Math.min(0, lo); hi = hi + 1; }
    domain = hi;
    fill = v => sequential(hue, (v - lo) / (hi - lo));
  }

  for(const name in paths){
    const v = valueAt(r, name), p = paths[name];
    p.setAttribute('fill', v === null ? 'var(--grid)' : fill(v));
    p.classList.toggle('off', v === null);
    labels[name].classList.toggle('off', v === null);
    p.querySelector('title')?.remove();
    const t = document.createElementNS(NS,'title');
    t.textContent = `${name}: ` + (!r.precincts[name] ? 'not on the ballot'
      : r.precincts[name].total === 0 ? 'no ballots cast' : fmtValue(v));
    p.appendChild(t);
  }
  svg.querySelector('title').textContent =
    `Map of ${DATA.county} County's ${DATA.precincts.length} voting precincts shaded by `
    + `${METRIC.label} in the ${r.office} race.`;

  /* legend */
  const stops = [];
  for(let i = 0; i <= 40; i++){
    const f = i / 40;
    stops.push(fill(lo + (hi - lo) * f) + ' ' + (f*100).toFixed(1) + '%');
  }
  $('legramp').style.background = 'linear-gradient(90deg,' + stops.join(',') + ')';
  if(METRIC.kind === 'margin' || METRIC.kind === 'shift'){
    $('legticks').innerHTML = [-domain,-domain/2,0,domain/2,domain]
      .map(v => `<span>${v === 0 ? '0' : signed(v,0)}</span>`).join('');
    $('legends').innerHTML = METRIC.kind === 'shift'
      ? '<span>&#9664; Shift to Republican</span><span>Shift to Democrat &#9654;</span>'
      : `<span>&#9664; ${r.cands[r.repIdx].name} (R)</span>`
        + `<span>${r.cands[r.demIdx].name} (D) &#9654;</span>`;
  } else {
    const fmt = v => METRIC.kind === 'turnout' ? nf(Math.round(v)) : v.toFixed(1) + '%';
    $('legticks').innerHTML = [lo, (lo+hi)/2, hi].map(v => `<span>${fmt(v)}</span>`).join('');
    $('legends').innerHTML =
      `<span>${METRIC.kind === 'turnout' ? 'Fewest ballots' : 'Weakest precinct'}</span>`
      + `<span>${METRIC.kind === 'turnout' ? 'Most ballots' : 'Strongest precinct'}</span>`;
  }
  const offCount = DATA.precincts.length - onBallot.length;
  const emptyCount = onBallot.filter(p => r.precincts[p].total === 0).length;
  const bits = [];
  if(offCount) bits.push(`${offCount} of ${DATA.precincts.length} precincts are outside this race`);
  if(emptyCount) bits.push(`${emptyCount} on the ballot recorded no ballots cast`);
  if(METRIC.kind === 'shift')
    bits.unshift(`${r.prior.dem} (D) v ${r.prior.rep} (R) in ${r.prior.year}, `
      + `${r.cands[r.demIdx].name} (D) v ${r.cands[r.repIdx].name} (R) in 2026`);
  else if(METRIC.kind !== 'margin')
    bits.unshift('the ramp spans the range actually observed, not 0 to the maximum possible');
  const note = bits.length
    ? bits.join('; ') + '.'
    : `All ${DATA.precincts.length} precincts vote in this race.`;
  $('legnote').textContent = note.charAt(0).toUpperCase() + note.slice(1);

  /* table */
  const ranked = onBallot.slice().sort((a,b) => {
    const x = valueAt(r,b), y = valueAt(r,a);
    const d = (x === null ? -1e12 : x) - (y === null ? -1e12 : y);
    return d !== 0 ? d : a.localeCompare(b);
  }).concat(DATA.precincts.filter(p => !r.precincts[p]).sort());

  const shiftView = METRIC.kind === 'shift';
  $('thead').innerHTML = shiftView
    ? `<th>#</th><th>Precinct</th><th>Shift</th><th>D ${r.prior.year}</th><th>D 2026</th>`
      + `<th>Cast ${r.prior.year}</th><th>Cast 2026</th>`
    : `<th>#</th><th>Precinct</th><th>${
        METRIC.kind === 'margin' ? 'Margin' : METRIC.kind === 'turnout' ? 'Ballots' : 'Share'}</th>`
      + r.cands.map(c => `<th>${surname(c.name)}</th>`).join('')
      + '<th>Ballots</th>';

  $('rows').innerHTML = ranked.map((name,i) => {
    const row = r.precincts[name], v = valueAt(r, name), out = !row;
    const p22 = shiftView && row ? r.prior.precincts[name] : null;
    const cells = shiftView
      ? `<td>${p22 ? pct(dTwo(p22.d, p22.r)) : '—'}</td>`
        + `<td>${out || !row.total ? '—' : pct(dTwo(row.v[r.demIdx], row.v[r.repIdx]))}</td>`
        + `<td>${p22 ? nf(p22.total) : '—'}</td>`
        + `<td>${out ? '—' : nf(row.total)}</td>`
      : r.cands.map((c,ci) => `<td>${out ? '—' : nf(row.v[ci])}</td>`).join('')
        + `<td>${out ? '—' : nf(row.total)}</td>`;
    return `<tr data-name="${name}"${out ? ' class="off"' : ''}>
      <td>${out ? '—' : i+1}</td>
      <td><span class="chip" style="background:${v === null ? 'var(--grid)' : fill(v)}"></span>${name}</td>
      <td class="val">${out ? 'not on ballot' : row.total === 0 ? 'no ballots' : fmtValue(v)}</td>
      ${cells}
    </tr>`;
  }).join('');
  for(const tr of $('rows').children){
    const name = tr.dataset.name;
    tr.addEventListener('pointerenter', e => hover(name, e));
    tr.addEventListener('pointermove', moveTip);
    tr.addEventListener('pointerleave', unhover);
    tr.addEventListener('click', () => { PINNED = PINNED === name ? null : name; paint(); });
  }
  $('tabletitle').textContent = METRIC.kind === 'shift'
    ? `Precincts ranked by shift toward ${r.cands[r.demIdx].name}`
    : METRIC.kind === 'turnout'
    ? 'Precincts ranked by ballots cast'
    : METRIC.kind === 'margin'
      ? `Precincts ranked by ${poss(r.cands[r.demIdx].name)} margin`
      : `Precincts ranked by ${poss(r.cands[METRIC.idx].name)} share`;
  $('tablenote').textContent = `${onBallot.length} precinct${onBallot.length === 1 ? '' : 's'} · `
    + `${nf(r.total)} ballots cast`;

  /* race header */
  const lead = Math.max(...r.cands.map(c => c.total));
  const winners = r.cands.slice().sort((a,b) => b.total - a.total).slice(0, r.seats).map(c => c.name);
  $('rhead').innerHTML = `
    <h2>${r.office}</h2>
    <div class="meta">${r.cat} &middot; ${r.seats > 1 ? r.seats + ' seats' : '1 seat'}
      &middot; ${onBallot.length} precinct${onBallot.length === 1 ? '' : 's'}
      &middot; ${nf(r.total)} ballots cast
      ${r.cands.length === 1 ? '&middot; unopposed' : ''}</div>
    ${r.total === 0 ? '<div class="meta" style="color:#b07400;font-weight:600">'
      + '&#9888; No votes are recorded for this race in any precinct.</div>' : ''}
    <div class="bar">${r.cands.map(c =>
      `<span style="width:${r.total ? 100*c.total/r.total : 0}%;background:${swatch(c.bucket)}"></span>`).join('')}</div>
    <div class="clist">${r.cands.map(c => `
      <div class="cand${r.cands.length > 1 && winners.includes(c.name) ? ' win' : ''}">
        <span class="sw" style="background:${swatch(c.bucket)}"></span>
        <span class="nm">${c.name}</span>
        <span class="pa">${c.party}</span>
        <span class="vt">${nf(c.total)} &middot; ${r.total ? pct(100*c.total/r.total) : '—'}</span>
      </div>`).join('')}</div>`;

  $('foot').innerHTML =
    `Source: Indiana Secretary of State 2026 general election results, precinct level, `
    + `${DATA.county} County. `
    + 'Precinct boundaries: Indiana Voting District Boundaries 2023 (<code>p23</code>). '
    + 'Percentages are of all ballots cast in that race in that precinct. '
    + (r.prior ? `${r.prior.year} precinct results come from the ${DATA.county} County clerk's `
        + `election workbook (the state's ${r.prior.year} export reports ${DATA.county} at county level only); `
        + `its countywide totals differ from the state's certified figures by about 3 votes. `
        + `Shift = (2026 D share of D+R) &minus; (${r.prior.year} D share of D+R), in percentage points, `
        + `and assumes precinct boundaries did not change between the two elections &mdash; the same `
        + `${DATA.precincts.length} precinct names appear in both. ` : '')
    + (r.seats > 1 ? `This race elects ${r.seats}, so voters could pick up to ${r.seats} and shares sum above 100%. ` : '')
    + 'Click a precinct or row to pin it; Esc clears.';

  highlight(PINNED);
  declutter();
}

/* ---------- controls ---------- */
const raceSel = $('race'), metricSel = $('metric');
for(const g of DATA.groups){
  const rs = DATA.races.filter(r => r.group === g);
  if(!rs.length) continue;
  const og = document.createElement('optgroup');
  og.label = g;
  for(const r of rs){
    const o = document.createElement('option');
    o.value = r.id; o.textContent = r.office;
    og.appendChild(o);
  }
  raceSel.appendChild(og);
}
function loadMetrics(keepKind){
  const opts = metricsFor(RACE);
  metricSel.innerHTML = opts.map((m,i) => `<option value="${i}">${m.label}</option>`).join('');
  let pick = 0;
  if(keepKind === 'turnout') pick = opts.length - 1;
  METRIC = opts[pick];
  metricSel.value = String(pick);
}
raceSel.addEventListener('change', () => {
  RACE = DATA.races.find(r => r.id === raceSel.value);
  loadMetrics(METRIC && METRIC.kind === 'turnout' ? 'turnout' : null);
  paint();
});
metricSel.addEventListener('change', () => {
  METRIC = metricsFor(RACE)[+metricSel.value];
  paint();
});
$('view').addEventListener('change', () => { VIEW = $('view').value; applyView(); });
$('labels').addEventListener('click', () => {
  const on = $('labels').getAttribute('aria-pressed') === 'true';
  $('labels').setAttribute('aria-pressed', String(!on));
  gLabels.style.display = on ? 'none' : '';
});
function applyView(){
  const vb = DATA.viewBox.split(' ').map(Number);
  const box = (VIEW === 'city' && CITY_BOX) ? CITY_BOX : vb;
  svg.setAttribute('viewBox', box.join(' '));
  svg.style.setProperty('--zoom', (box[2] / vb[2]).toFixed(4));
  declutter();
}

/* Greedy label placement, biggest precinct first: a label is dropped if its box
   would overlap one already placed. Dropped names stay in the table and tooltip. */
function declutter(){
  const order = DATA.shapes.slice().sort((a,b) => b.area - a.area);
  const placed = [];
  const vb = svg.getAttribute('viewBox').split(' ').map(Number);
  const unit = vb[2] / 1000;                     // viewBox units per 0.1% of width
  for(const s of order){
    const el = labels[s.name];
    const w = s.name.length * 4.6 * unit * 1.15, h = 10 * unit;
    const box = [s.cx - w/2, s.cy - h/2, s.cx + w/2, s.cy + h/2];
    const off = s.cx < vb[0] || s.cx > vb[0]+vb[2] || s.cy < vb[1] || s.cy > vb[1]+vb[3];
    const clash = placed.some(b => !(box[2] < b[0] || box[0] > b[2] || box[3] < b[1] || box[1] > b[3]));
    const hide = off || clash;
    el.classList.toggle('hidden', hide);
    if(!hide) placed.push(box);
  }
  // the pinned or hovered precinct always shows its name
  if(PINNED && labels[PINNED]) labels[PINNED].classList.remove('hidden');
}

function applyMode(){
  MODE = document.documentElement.dataset.theme
    ? document.documentElement.dataset.theme
    : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  paint();
}
$('theme').addEventListener('click', () => {
  document.documentElement.dataset.theme = (MODE === 'dark') ? 'light' : 'dark';
  applyMode();
});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
  if(!document.documentElement.dataset.theme) applyMode();
});
document.addEventListener('keydown', e => { if(e.key === 'Escape'){ PINNED = null; paint(); } });

document.title = `${DATA.county} County Precinct Results 2026`;
$('h1').innerHTML = `${DATA.county} County, 2026 general election &mdash; results by precinct`;
$('sub').textContent =
  `Every race on the ${DATA.county} County ballot, precinct by precinct. Pick a race, then pick `
  + `what the map should shade: the head-to-head margin, one candidate's share of the vote, or `
  + `ballots cast. Hover a precinct or a table row for the full result there.`;
if(CITY_BOX) $('viewCity').textContent = DATA.cityLabel;
else $('view').closest('.field').style.display = 'none';

raceSel.value = RACE.id;
loadMetrics();
applyMode();
applyView();
</script>
</body>
</html>
